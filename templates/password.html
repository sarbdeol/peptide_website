<!DOCTYPE html>
<html>
<head>
  <title>Access Required</title>
  <style>
    body {
      background:#0f172a;
      color:white;
      display:flex;
      align-items:center;
      justify-content:center;
      height:100vh;
      font-family:system-ui;
    }
    .box {
      background:#020617;
      padding:40px;
      border-radius:14px;
      width:360px;
      text-align:center;
      box-shadow:0 30px 80px rgba(0,0,0,.6);
    }
    input {
      width:100%;
      padding:12px;
      border-radius:8px;
      border:none;
      margin-top:14px;
    }
    button {
      margin-top:14px;
      width:100%;
      padding:12px;
      background:#2563eb;
      border:none;
      border-radius:8px;
      color:white;
      font-weight:600;
      cursor:pointer;
    }
    .err { color:#f87171; margin-top:10px; }
  </style>
</head>
<body>
  <form class="box" method="post">
    {% csrf_token %}
    <h2>Private Research Portal</h2>
    <p>Enter access password</p>

    <input type="password" name="password" placeholder="Password" required>
    <button type="submit">Enter</button>

    {% if error %}
      <div class="err">{{ error }}</div>
    {% endif %}
  </form>
</body>
</html>
